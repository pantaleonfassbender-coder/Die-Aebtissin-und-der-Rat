<a href="#/text/gelehrte/celtis/1"><text x="474" y="165" text-anchor="start" font-size="14" fill="var(--ink)" stroke="var(--panel)" stroke-width="5" paint-order="stroke" text-decoration="underline"><tspan x="474" dy="0">Trost, Mahnung,</tspan><tspan x="474" dy="16">1502</tspan></text></a>
<a href="#/text/gelehrte/celtis/8"><text x="285" y="250" text-anchor="middle" font-size="14" fill="var(--ink)" stroke="var(--panel)" stroke-width="5" paint-order="stroke" text-decoration="underline"><tspan x="285" dy="0">Abschrift zur Korrektur</tspan></text></a>
<a href="#/text/gelehrte/bruder/1"><text x="285" y="304" text-anchor="middle" font-size="14" fill="var(--ink)" stroke="var(--panel)" stroke-width="5" paint-order="stroke" text-decoration="underline"><tspan x="285" dy="0">Plutarch, Prudentius,</tspan><tspan x="285" dy="16">Hieronymus</tspan></text></a>
<a href="#/text/gelehrte/bruder/5"><text x="318" y="150" text-anchor="middle" font-size="14" fill="var(--ink)" stroke="var(--panel)" stroke-width="5" paint-order="stroke" text-decoration="underline"><tspan x="318" dy="0">1504: ‚Äbtissin geworden‘</tspan></text></a>
<a href="#/text/gelehrte/bruder/6"><text x="130" y="175" text-anchor="start" font-size="14" fill="var(--ink)" stroke="var(--panel)" stroke-width="5" paint-order="stroke" text-decoration="underline"><tspan x="130" dy="0">‚sie lesen das</tspan><tspan x="130" dy="16">Neue Testament‘</tspan></text></a>
<a href="#/text/gelehrte/bruder/5"><text x="262" y="365" text-anchor="middle" font-size="14" fill="var(--ink)" stroke="var(--panel)" stroke-width="5" paint-order="stroke" text-decoration="underline"><tspan x="262" dy="0">verbieten das Latein</tspan></text></a>
<a href="#/text/gelehrte/scheurl/1"><text x="668" y="160" text-anchor="start" font-size="14" fill="var(--ink)" stroke="var(--panel)" stroke-width="5" paint-order="stroke" text-decoration="underline"><tspan x="668" dy="0">Brief und Büchlein 1506</tspan></text></a>
<a href="#/text/gelehrte/scheurl/3"><text x="615" y="261" text-anchor="middle" font-size="14" fill="var(--ink)" stroke="var(--panel)" stroke-width="5" paint-order="stroke" text-decoration="underline"><tspan x="615" dy="0">geistliche Briefe</tspan></text></a>
<a href="#/text/gelehrte/scheurl/4"><text x="640" y="345" text-anchor="start" font-size="14" fill="var(--ink)" stroke="var(--panel)" stroke-width="5" paint-order="stroke" text-decoration="underline"><tspan x="640" dy="0">Briefe ‚durch Zufall‘</tspan><tspan x="640" dy="16">gedruckt</tspan></text></a>
<a href="#/text/gelehrte/bruder/4"><text x="460" y="360" text-anchor="start" font-size="14" fill="var(--ink)" stroke="var(--panel)" stroke-width="5" paint-order="stroke" text-decoration="underline"><tspan x="460" dy="0">lesen zusammen</tspan></text></a>
<a href="#/text/gelehrte/muench/2"><text x="790" y="495" text-anchor="start" font-size="14" fill="var(--ink)" stroke="var(--panel)" stroke-width="5" paint-order="stroke" text-decoration="underline"><tspan x="790" dy="0">übersetzt,</tspan><tspan x="790" dy="16">widerspricht</tspan></text></a>
<text x="16" y="610" font-size="12.5" fill="var(--ink2)">Gestrichelt: ohne Zutun der Schreiberin (das Verbot, der Druck) und die spätere Lektüre.</text>
<text x="16" y="628" font-size="12.5" fill="var(--ink2)">Das Verbot und Willibalds Sätze an Celtis und Erasmus kennt der Apparat nur aus Münchs Zitaten.</text>
</svg>
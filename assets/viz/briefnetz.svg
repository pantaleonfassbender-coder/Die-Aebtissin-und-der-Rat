<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img" aria-labelledby="bn-t bn-d" font-family="var(--serif)">
<title id="bn-t">Briefnetz um Caritas Pirckheimer, 1502–1515</title>
<desc id="bn-d">Wer wem über Caritas schrieb oder schickte: Celtis, Willibald, Scheurl, Sixtus Tucher, Erasmus, der Drucker Peypus, die Franziskaner, und Münch 1826. Jede Beschriftung verlinkt die Stelle im Modul.</desc>
<defs><marker id="bn-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink2)"/></marker><marker id="bn-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--red)"/></marker></defs>
<text x="16" y="30" font-size="17" font-weight="bold" fill="var(--ink)">Briefnetz, 1502–1515</text>
<text x="16" y="50" font-size="13" fill="var(--ink2)">Wer an wen schrieb oder schickte. Die Beschriftungen führen zur Stelle.</text>
<line x1="436" y1="126" x2="436" y2="239" stroke="var(--ink2)" stroke-width="1.4" marker-end="url(#bn-a)"/>
<line x1="464" y1="239" x2="464" y2="126" stroke="var(--ink2)" stroke-width="1.4" marker-end="url(#bn-a)"/>

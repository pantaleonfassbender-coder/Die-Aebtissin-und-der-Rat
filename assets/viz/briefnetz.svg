<line x1="178" y1="239" x2="392" y2="126" stroke="var(--ink2)" stroke-width="1.4" marker-end="url(#bn-a)"/>
<line x1="120" y1="239" x2="120" y2="126" stroke="var(--ink2)" stroke-width="1.4" marker-end="url(#bn-a)"/>
<line x1="182" y1="404" x2="388" y2="301" stroke="var(--red)" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#bn-r)"/>
<line x1="722" y1="126" x2="508" y2="239" stroke="var(--ink2)" stroke-width="1.4" marker-end="url(#bn-a)"/>
<line x1="699" y1="270" x2="531" y2="270" stroke="var(--ink2)" stroke-width="1.4" marker-end="url(#bn-a)"/>
<line x1="512" y1="301" x2="718" y2="404" stroke="var(--ink2)" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#bn-a)"/>
<line x1="450" y1="301" x2="450" y2="404" stroke="var(--ink2)" stroke-width="1.4" marker-end="url(#bn-a)"/>
<line x1="780" y1="466" x2="780" y2="534" stroke="var(--ink2)" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#bn-a)"/>
<g><rect x="45.0" y="70.0" width="150" height="50" rx="8" fill="var(--panel)" stroke="var(--nachwelt)" stroke-width="1.6"/><text x="120" y="92" text-anchor="middle" font-size="16" fill="var(--nachwelt)">Erasmus</text><text x="120" y="110" text-anchor="middle" font-size="12" fill="var(--ink2)">Basel</text></g>
<g><rect x="375.0" y="70.0" width="150" height="50" rx="8" fill="var(--panel)" stroke="var(--nachwelt)" stroke-width="1.6"/><text x="450" y="92" text-anchor="middle" font-size="16" fill="var(--nachwelt)">Konrad Celtis</text><text x="450" y="110" text-anchor="middle" font-size="12" fill="var(--ink2)">Dichter</text></g>
<g><rect x="705.0" y="70.0" width="150" height="50" rx="8" fill="var(--panel)" stroke="var(--nachwelt)" stroke-width="1.6"/><text x="780" y="92" text-anchor="middle" font-size="16" fill="var(--nachwelt)">Christoph Scheurl</text><text x="780" y="110" text-anchor="middle" font-size="12" fill="var(--ink2)">Bologna 1506</text></g>
<g><rect x="45.0" y="245.0" width="150" height="50" rx="8" fill="var(--panel)" stroke="var(--nachwelt)" stroke-width="1.6"/><text x="120" y="267" text-anchor="middle" font-size="16" fill="var(--nachwelt)">Willibald</text><text x="120" y="285" text-anchor="middle" font-size="12" fill="var(--ink2)">Bruder, Lehrer</text></g>
<g><rect x="375.0" y="245.0" width="150" height="50" rx="8" fill="var(--panel)" stroke="var(--konvent)" stroke-width="2.4"/><text x="450" y="267" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--konvent)">Caritas</text><text x="450" y="285" text-anchor="middle" font-size="12" fill="var(--ink2)">Nonne, ab 1503 Äbtissin</text></g>
<g><rect x="705.0" y="245.0" width="150" height="50" rx="8" fill="var(--panel)" stroke="var(--nachwelt)" stroke-width="1.6"/><text x="780" y="267" text-anchor="middle" font-size="16" fill="var(--nachwelt)">Sixtus Tucher</text><text x="780" y="285" text-anchor="middle" font-size="12" fill="var(--ink2)">an Caritas und Apollonia</text></g>
<g><rect x="45.0" y="410.0" width="150" height="50" rx="8" fill="var(--panel)" stroke="var(--red)" stroke-width="1.6"/><text x="120" y="432" text-anchor="middle" font-size="16" fill="var(--red)">Die Franziskaner</text><text x="120" y="450" text-anchor="middle" font-size="12" fill="var(--ink2)">‚Holzfüße‘, Beichtväter</text></g>
<g><rect x="375.0" y="410.0" width="150" height="50" rx="8" fill="var(--panel)" stroke="var(--konvent)" stroke-width="1.6"/><text x="450" y="432" text-anchor="middle" font-size="16" fill="var(--konvent)">Klara</text><text x="450" y="450" text-anchor="middle" font-size="12" fill="var(--ink2)">Schwester, Nonne</text></g>
<g><rect x="705.0" y="410.0" width="150" height="50" rx="8" fill="var(--panel)" stroke="var(--gold)" stroke-width="1.6"/><text x="780" y="432" text-anchor="middle" font-size="16" fill="var(--gold)">Peypus, Drucker</text><text x="780" y="450" text-anchor="middle" font-size="12" fill="var(--ink2)">Nürnberg 1515</text></g>
<g><rect x="705.0" y="540.0" width="150" height="50" rx="8" fill="var(--panel)" stroke="var(--nachwelt)" stroke-width="1.6"/><text x="780" y="562" text-anchor="middle" font-size="16" fill="var(--nachwelt)">Ernst Münch</text><text x="780" y="580" text-anchor="middle" font-size="12" fill="var(--ink2)">Herausgeber 1826</text></g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="fa-t fa-d" font-family="var(--serif)">
<title id="fa-t">Die Pirckheimer und das Kloster</title>
<desc id="fa-d">Willibald Pirckheimer in der Mitte; links die Frauen der Familie in St. Klara (Caritas, Klara, zwei Töchter, darunter Katharina), unten Sabina und Euphemia in Bergen; rechts Melanchthon, der Rat und der Pfleger; oben Celtis.</desc>
<defs><marker id="fa-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink2)"/></marker></defs>
<text x="16" y="28" font-size="17" font-weight="bold" fill="var(--ink)">Die Pirckheimer und das Kloster</text>
<text x="16" y="47" font-size="13" fill="var(--ink2)">Violett: Frauen der Familie im Kloster. Gestrichelt: nur erschlossen oder aus zweiter Hand.</text>
<rect x="60" y="100" width="240" height="490" rx="14" fill="var(--konvent)" opacity="0.06"/>
<text x="70" y="120" font-size="12.5" fill="var(--konvent)">St. Klara, Nürnberg</text>
<line x1="392" y1="268" x2="238" y2="182" stroke="var(--ink2)" stroke-width="1.4" marker-end="url(#fa-a)"/>
<line x1="271" y1="300" x2="359" y2="300" stroke="var(--ink2)" stroke-width="1.4" marker-end="url(#fa-a)"/>
<line x1="392" y1="332" x2="238" y2="418" stroke="var(--ink2)" stroke-width="1.4" marker-end="url(#fa-a)"/>
<line x1="180" y1="482" x2="180" y2="523" stroke="var(--ink2)" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#fa-a)"/>
<line x1="450" y1="332" x2="450" y2="488" stroke="var(--ink2)" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#fa-a)"/>
<line x1="501" y1="268" x2="684" y2="152" stroke="var(--ink2)" stroke-width="1.4" marker-end="url(#fa-a)"/>
<line x1="541" y1="300" x2="644" y2="300" stroke="var(--ink2)" stroke-width="1.4" marker-end="url(#fa-a)"/>
<line x1="450" y1="268" x2="450" y2="122" stroke="var(--ink2)" stroke-width="1.4" marker-end="url(#fa-a)"/>
<line x1="504" y1="332" x2="681" y2="438" stroke="var(--ink2)" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#fa-a)"/>
<a href="#/text/willibald/melanchthon/1"><g><rect x="364.0" y="273.0" width="172" height="54" rx="8" fill="var(--panel)" stroke="var(--nachwelt)" stroke-width="2.4"/><text x="450" y="296" text-anchor="middle" font-size="15" font-weight="bold" fill="var(--nachwelt)">Willibald</text><text x="450" y="314" text-anchor="middle" font-size="11.5" fill="var(--ink2)">Ratsherr, Humanist, † 1530</text></g></a>
<a href="#/text/ende/koppius/2"><g><rect x="94.0" y="123.0" width="172" height="54" rx="8" fill="var(--panel)" stroke="var(--konvent)" stroke-width="1.5"/><text x="180" y="146" text-anchor="middle" font-size="15" font-weight="normal" fill="var(--konvent)">Caritas</text><text x="180" y="164" text-anchor="middle" font-size="11.5" fill="var(--ink2)">Äbtissin 1503–1532</text></g></a>
<a href="#/text/willibald/klara/1"><g><rect x="94.0" y="273.0" width="172" height="54" rx="8" fill="var(--panel)" stroke="var(--konvent)" stroke-width="1.5"/><text x="180" y="296" text-anchor="middle" font-size="15" font-weight="normal" fill="var(--konvent)">Klara</text><text x="180" y="314" text-anchor="middle" font-size="11.5" fill="var(--ink2)">Schwester; Äbtissin 1532/33</text></g></a>
<a href="#/text/willibald/melanchthon/1"><g><rect x="94.0" y="423.0" width="172" height="54" rx="8" fill="var(--panel)" stroke="var(--konvent)" stroke-width="1.5"/><text x="180" y="446" text-anchor="middle" font-size="15" font-weight="normal" fill="var(--konvent)">zwei Töchter</text><text x="180" y="464" text-anchor="middle" font-size="11.5" fill="var(--ink2)">in St. Klara (Brief 1525)</text></g></a>
<a href="#/text/ende/koppius/2"><g><rect x="94.0" y="528.0" width="172" height="54" rx="8" fill="var(--panel)" stroke="var(--konvent)" stroke-width="1.5"/><text x="180" y="551" text-anchor="middle" font-size="15" font-weight="normal" fill="var(--konvent)">Katharina</text><text x="180" y="569" text-anchor="middle" font-size="11.5" fill="var(--ink2)">Äbtissin 1533–1563</text></g></a>
<a href="#/text/ende/koppius/2"><g><rect x="364.0" y="493.0" width="172" height="54" rx="8" fill="var(--panel)" stroke="var(--konvent)" stroke-width="1.5"/><text x="450" y="516" text-anchor="middle" font-size="15" font-weight="normal" fill="var(--konvent)">Sabina, Euphemia</text><text x="450" y="534" text-anchor="middle" font-size="11.5" fill="var(--ink2)">Äbtissinnen in Bergen</text></g></a>
<a href="#/text/willibald/melanchthon/1"><g><rect x="649.0" y="93.0" width="172" height="54" rx="8" fill="var(--panel)" stroke="var(--reform)" stroke-width="1.5"/><text x="735" y="116" text-anchor="middle" font-size="15" font-weight="normal" fill="var(--reform)">Melanchthon</text><text x="735" y="134" text-anchor="middle" font-size="11.5" fill="var(--ink2)">Brief 1525; Besuch Nov. 1525</text></g></a>
<a href="#/text/willibald/oratio/2"><g><rect x="649.0" y="273.0" width="172" height="54" rx="8" fill="var(--panel)" stroke="var(--rat)" stroke-width="1.5"/><text x="735" y="296" text-anchor="middle" font-size="15" font-weight="normal" fill="var(--rat)">Der Rat</text><text x="735" y="314" text-anchor="middle" font-size="11.5" fill="var(--ink2)">‚Patres conscripti‘, 1530</text></g></a>
<a href="#/text/gelehrte/celtis/8"><g><rect x="364.0" y="63.0" width="172" height="54" rx="8" fill="var(--panel)" stroke="var(--nachwelt)" stroke-width="1.5"/><text x="450" y="86" text-anchor="middle" font-size="15" font-weight="normal" fill="var(--nachwelt)">Celtis</text><text x="450" y="104" text-anchor="middle" font-size="11.5" fill="var(--ink2)">Lehrer der Schwester, 1502</text></g></a>
<a href="#/text/willibald/klara/4"><g><rect x="649.0" y="443.0" width="172" height="54" rx="8" fill="var(--panel)" stroke="var(--rat)" stroke-width="1.5"/><text x="735" y="466" text-anchor="middle" font-size="15" font-weight="normal" fill="var(--rat)">Kaspar Nützel</text><text x="735" y="484" text-anchor="middle" font-size="11.5" fill="var(--ink2)">Pfleger; Antworten mit Rat</text></g></a>
<a href="#/text/gelehrte/bruder/4"><text x="315" y="219" text-anchor="middle" font-size="12.5" fill="var(--ink)" stroke="var(--panel)" stroke-width="5" paint-order="stroke" text-decoration="underline">Bücher, Korrektur, Rat</text></a>
<a href="#/text/willibald/klara/1"><text x="315" y="280" text-anchor="middle" font-size="12.5" fill="var(--ink)" stroke="var(--panel)" stroke-width="5" paint-order="stroke" text-decoration="underline">‚keinen Menschen außer dir‘</text></a>
<a href="#/text/willibald/melanchthon/1"><text x="315" y="369" text-anchor="middle" font-size="12.5" fill="var(--ink)" stroke="var(--panel)" stroke-width="5" paint-order="stroke" text-decoration="underline">‚ich irrte mit den anderen‘</text></a>
<a href="#/text/willibald/klara/2"><text x="180" y="496" text-anchor="middle" font-size="12.5" fill="var(--ink)" stroke="var(--panel)" stroke-width="5" paint-order="stroke" text-decoration="underline">eine von ihnen?</text></a>
<a href="#/text/ende/koppius/2"><text x="450" y="404" text-anchor="middle" font-size="12.5" fill="var(--ink)" stroke="var(--panel)" stroke-width="5" paint-order="stroke" text-decoration="underline">Schwestern (Müllner, nach Höfler)</text></a>
<a href="#/text/willibald/melanchthon/3"><text x="592" y="204" text-anchor="middle" font-size="12.5" fill="var(--ink)" stroke="var(--panel)" stroke-width="5" paint-order="stroke" text-decoration="underline">bittet um Hilfe</text></a>
<a href="#/text/willibald/oratio/6"><text x="592" y="280" text-anchor="middle" font-size="12.5" fill="var(--ink)" stroke="var(--panel)" stroke-width="5" paint-order="stroke" text-decoration="underline">Rede im Namen der Nonnen</text></a>
<a href="#/text/gelehrte/celtis/8"><text x="450" y="189" text-anchor="middle" font-size="12.5" fill="var(--ink)" stroke="var(--panel)" stroke-width="5" paint-order="stroke" text-decoration="underline">Freund, 1502</text></a>
<a href="#/text/willibald/klara/4"><text x="592" y="379" text-anchor="middle" font-size="12.5" fill="var(--ink)" stroke="var(--panel)" stroke-width="5" paint-order="stroke" text-decoration="underline">‚stell ihr eine Form‘</text></a>
</svg>
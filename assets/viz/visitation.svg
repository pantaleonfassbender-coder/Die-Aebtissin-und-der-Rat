<circle cx="263.2" cy="176" r="8" fill="var(--nachwelt)"/><text x="279.2" y="181" font-size="14" fill="var(--ink)"><tspan font-weight="bold">23</tspan> nach Zureden der Äbtissin befragt</text>
<circle cx="584.0" cy="176" r="8" fill="var(--konvent)"/><text x="600.0" y="181" font-size="14" fill="var(--ink)"><tspan font-weight="bold">13</tspan> verweigert</text>
<text x="16" y="212" font-size="13" fill="var(--ink2)">Die Befragten blieben ‚fast alle‘ bei derselben Antwort; die Visitatoren: ‚sie pfeifen alle in ein Rohr‘.</text>
<text x="16" y="230" font-size="13" fill="var(--ink2)">Eine sprach vom Abendmahl unter beiderlei Gestalt: Anna Schwarz, die im Februar 1528 ging.</text>
<line x1="16" y1="266" x2="884" y2="266" stroke="var(--line)"/>
<text x="16" y="292" font-size="14" font-weight="bold" fill="var(--ink)">Der Rat im Kloster, 1525–1528</text>
<a href="#/text/ordnung/visitation/1"><g><rect x="18.0" y="306" width="116.0" height="74" rx="6" fill="var(--panel)" stroke="var(--rat)"/><text x="25.0" y="326" font-size="12.5" font-weight="bold" fill="var(--rat)">Aug. 1525</text>
<text x="25.0" y="344" font-size="12.5" fill="var(--ink)">Wein nur mit</text>
<text x="25.0" y="359" font-size="12.5" fill="var(--ink)">Zettel vom</text>
<text x="25.0" y="374" font-size="12.5" fill="var(--ink)">Ungelter</text>
</g></a>
<a href="#/text/ordnung/visitation/1"><g><rect x="142.0" y="306" width="116.0" height="74" rx="6" fill="var(--panel)" stroke="var(--rat)"/><text x="149.0" y="326" font-size="12.5" font-weight="bold" fill="var(--rat)">2. Jan. 1526</text>
<text x="149.0" y="344" font-size="12.5" fill="var(--ink)">der Biermesser</text>
</g></a>
<a href="#/text/ordnung/visitation/5"><g><rect x="266.0" y="306" width="116.0" height="74" rx="6" fill="var(--panel)" stroke="var(--rat)"/><text x="273.0" y="326" font-size="12.5" font-weight="bold" fill="var(--rat)">Nov. 1527</text>
<text x="273.0" y="344" font-size="12.5" fill="var(--ink)">300 Gulden</text>
<text x="273.0" y="359" font-size="12.5" fill="var(--ink)">gefordert</text>
</g></a>
<a href="#/text/ordnung/visitation/2"><g><rect x="390.0" y="306" width="116.0" height="74" rx="6" fill="var(--panel)" stroke="var(--rat)"/><text x="397.0" y="326" font-size="12.5" font-weight="bold" fill="var(--rat)">2. Nov. 1527</text>
<text x="397.0" y="344" font-size="12.5" fill="var(--ink)">weltliche</text>
<text x="397.0" y="359" font-size="12.5" fill="var(--ink)">Visitation</text>
</g></a>
<a href="#/text/ordnung/anna/3"><g><rect x="514.0" y="306" width="116.0" height="74" rx="6" fill="var(--panel)" stroke="var(--familien)"/><text x="521.0" y="326" font-size="12.5" font-weight="bold" fill="var(--familien)">24. Febr. 1528</text>
<text x="521.0" y="344" font-size="12.5" fill="var(--ink)">Anna Schwarz</text>
<text x="521.0" y="359" font-size="12.5" fill="var(--ink)">geht</text>
</g></a>
<a href="#/text/ordnung/anna/4"><g><rect x="638.0" y="306" width="116.0" height="74" rx="6" fill="var(--panel)" stroke="var(--rat)"/><text x="645.0" y="326" font-size="12.5" font-weight="bold" fill="var(--rat)">10. März 1528</text>
<text x="645.0" y="344" font-size="12.5" fill="var(--ink)">Rückzahlung,</text>
<text x="645.0" y="359" font-size="12.5" fill="var(--ink)">Quittung</text>
</g></a>
<a href="#/text/ordnung/bamberg/1"><g><rect x="762.0" y="306" width="116.0" height="74" rx="6" fill="var(--panel)" stroke="var(--rat)"/><text x="769.0" y="326" font-size="12.5" font-weight="bold" fill="var(--rat)">1. Aug. 1528</text>
<text x="769.0" y="344" font-size="12.5" fill="var(--ink)">Antwort an den</text>
<text x="769.0" y="359" font-size="12.5" fill="var(--ink)">Bischof</text>
</g></a>
